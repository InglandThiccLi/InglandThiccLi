<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal music playlist and links.">
    <title data-site-title="title.music">Music</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../Common/styles.css" rel="stylesheet">
    <link href="music.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../Common/src/favicon.png">
</head>

<body id="top" data-page="music" data-bs-theme="light">
    <div id="site-header"></div>
    <main class="page-shell">
        <section class="page-hero">
            <div class="container">
                <div class="eyebrow" data-i18n="music.eyebrow"></div>
                <h1 class="page-title mt-3 mb-3" data-i18n="music.title"></h1>
                <p class="lead-copy" data-i18n="music.lead"></p>
            </div>
        </section>
        <section class="content-section pt-4">
            <div class="container">
                <div class="row g-4 align-items-start">
                    <div class="col-lg-4">
                        <div class="playlist-intro surface-card p-4 p-lg-5 reveal">
                            <div class="vinyl" aria-hidden="true">
                                <div class="vinyl-label"></div>
                            </div>
                            <h2 class="section-title mt-4" data-i18n="music.playlist.title"></h2>
                            <p class="text-muted-site mb-0" data-i18n="music.playlist.hint"></p>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="track-list surface-card p-3 p-md-4 reveal">
                            <div id="playlist"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="content-section pt-2">
            <div class="container">
                <div class="soft-panel p-4 p-lg-5 reveal">
                    <div class="row align-items-center g-4">
                        <div class="col-md">
                            <h2 class="section-title mb-2" data-i18n="music.links.title"></h2>
                            <p class="text-muted-site mb-0" data-i18n="music.links.body"></p>
                        </div>
                        <div class="col-md-auto">
                            <div class="social-links"><a class="social-link" data-social="youtube_1" target="_blank"
                                    rel="noreferrer">YouTube ↗</a><a class="social-link" data-social="instagram_1"
                                    target="_blank" rel="noreferrer">Instagram ↗</a><a class="social-link"
                                    data-social="musescore" target="_blank" rel="noreferrer">MuseScore ↗</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../Common/config.js" data-root=".."></script>
    <script src="../Common/scripts.js" data-root=".."></script>
    <script src="music.js"></script>
</body>

</html>
