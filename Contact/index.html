<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact information and social links.">
    <title data-site-title="title.contact">Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../Common/styles.css" rel="stylesheet">
    <link href="contact.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../Common/src/favicon.png">
</head>

<body id="top" data-page="contact">
    <div id="site-header"></div>
    <main class="page-shell">
        <section class="page-hero">
            <div class="container container-narrow">
                <div class="eyebrow" data-i18n="contact.eyebrow"></div>
                <h1 class="page-title mt-3 mb-3" data-i18n="contact.title"></h1>
                <p class="lead-copy" data-i18n="contact.lead"></p>
            </div>
        </section>
        <section class="content-section pt-4">
            <div class="container container-narrow">
                <div class="surface-card p-4 p-lg-5 reveal">
                    <div class="row align-items-center g-4">
                        <div class="col-md">
                            <div class="contact-icon mb-3" aria-hidden="true">📧</div>
                            <h2 class="section-title mb-2" data-i18n="contact.email.title"></h2>
                            <p class="text-muted-site mb-2" data-i18n="contact.email.body"></p><a
                                class="email-address h5 fw-bold text-decoration-none" data-site-email
                                href="mailto:ustthcli@gmail.com">ustthcli@gmail.com</a>
                        </div>
                        <div class="col-md-auto d-flex flex-column gap-2"><a class="btn btn-site-primary"
                                data-email-button href="mailto:ustthcli@gmail.com" data-i18n="contact.send">Send an
                                email ↗</a><button class="btn btn-site-outline" type="button" id="copy-email"
                                data-i18n="contact.copy">Copy
                                email</button></div>
                    </div>
                    <div id="copy-feedback" class="small mt-2" role="status" aria-live="polite"></div>
                </div>
            </div>
        </section>
        <section class="content-section pt-2">
            <div class="container container-narrow">
                <div class="section-heading-row reveal">
                    <div>
                        <h2 class="section-title mb-2" data-i18n="contact.links.title"></h2>
                        <p class="text-muted-site mb-0" data-i18n="contact.links.body"></p>
                    </div>
                </div>
                <div class="surface-card h-100 p-4 p-lg-5 d-flex flex-column reveal">
                    <div class="social-container">
                        <h4 class="d-inline-flex flex-wrap align-content-center">GitHub</h4>
                        <div class="social-links">
                            <a class="social-link" data-social="github_1" target="_blank" rel="noreferrer"><span
                                    class="social-logo github"></span><span>InglandThiccLi</span></a>
                            <a class="social-link" data-social="github_2" target="_blank" rel="noreferrer"><span
                                    class="social-logo github"></span><span>ppowoe</span></a>
                        </div>
                    </div>
                    <hr>
                    <div class="social-container">
                        <h4 class="d-inline-flex flex-wrap align-content-center" data-i18n="home.links.title.music">Half
                            Moon Music</h4>
                        <div class="social-links">
                            <a class="social-link" data-social="youtube_1" target="_blank" rel="noreferrer"><span
                                    class="social-logo youtube"></span></a>
                            <a class="social-link" data-social="instagram_1" target="_blank" rel="noreferrer"><span
                                    class="social-logo instagram"></span></a>
                            <a class="social-link" data-social="musescore" target="_blank" rel="noreferrer"><span
                                    class="social-logo musescore"></span></a>
                        </div>
                    </div>
                    <hr>
                    <div class="social-container">
                        <h4 class="d-inline-flex flex-wrap align-content-center" data-i18n="home.links.title.game">Quilt
                            Game</h4>
                        <div class="social-links">
                            <a class="social-link" data-social="itch" target="_blank" rel="noreferrer"><span
                                    class="social-logo itch"></span></a>
                            <a class="social-link" data-social="youtube_2" target="_blank" rel="noreferrer"><span
                                    class="social-logo youtube"></span></a>
                            <a class="social-link" data-social="instagram_2" target="_blank" rel="noreferrer"><span
                                    class="social-logo instagram"></span></a>
                            <a class="social-link" data-social="facebook" target="_blank" rel="noreferrer"><span
                                    class="social-logo facebook"></span></a>
                        </div>
                    </div>
                    <hr>
                    <div class="social-container">
                        <h4 class="d-inline-flex flex-wrap align-content-center" data-i18n="home.links.title.other">
                            Others</h4>
                        <div class="social-links">
                            <a class="social-link" data-social="youtube_3" target="_blank" rel="noreferrer"><span
                                    class="social-logo youtube"></span><span data-i18n="home.links.life_channel">Life
                                    Channel</span></a>
                            <a class="social-link" data-social="kofi" target="_blank" rel="noreferrer"><span
                                    class="social-logo kofi"></span><span data-i18n="home.links.kofi">Support me on
                                    Ko-fi</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../Common/config.js" data-root=".."></script>
    <script src="../Common/scripts.js" data-root=".."></script>
    <script src="contact.js"></script>
</body>

</html>
